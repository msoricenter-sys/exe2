<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 하늘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 한 줄 레이아웃: 현재 날씨 패널 → 시간별 띠 → 7일 목록, 최대 640px 단일 컬럼 */
:root {
  --bg: #eef3f7;
  --surface: #ffffff;
  --fg: #1c2833;
  --muted: #5f7180;
  --line: #d6e0e8;
  --accent: #2f6fa3;
  --warm: #c2622d;
  --cold: #2f6fa3;
  --rain: #3b8fb8;
  --font-display: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111a22; --surface: #18242f; --fg: #e4ecf2; --muted: #93a6b5;
    --line: #2a3b4a; --accent: #7fb6e2; --warm: #f0a070; --cold: #7fb6e2; --rain: #6cc0e6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding: 24px 16px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
form { display: flex; gap: 8px; flex: 1 1 240px; max-width: 320px; }
input, button {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
}
input { flex: 1; min-width: 0; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }

.now {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 4px 20px; align-items: center;
}
.now .icon { font-size: 3.4rem; grid-row: span 2; }
.now .temp { font-family: var(--font-display); font-size: 3rem; line-height: 1; }
.now .desc { color: var(--muted); }
.now dl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 12px 0 0; font-size: 0.9rem; }
.now dt { color: var(--muted); display: inline; }
.now dd { margin: 0 0 0 4px; display: inline; font-variant-numeric: tabular-nums; }
.tip { grid-column: 1 / -1; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.92rem; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; margin: 0 0 8px; }
.hourly { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
.hour { flex: 0 0 56px; text-align: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.hour .t { color: var(--muted); }
.hour .p { color: var(--rain); font-size: 0.75rem; min-height: 1.1em; }

.days { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.day {
  display: grid; grid-template-columns: 4.5em 2em 3em 1fr; align-items: center; gap: 10px;
  padding: 10px 16px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.day:first-child { border-top: 0; }
.day .rain { color: var(--rain); font-size: 0.8rem; text-align: right; }
.range { display: flex; align-items: center; gap: 8px; }
.range .lo { color: var(--cold); width: 2.4em; text-align: right; }
.range .hi { color: var(--warm); width: 2.4em; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; position: relative; }
.bar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--cold), var(--warm)); }
.status { color: var(--muted); font-size: 0.85rem; }
.error { color: var(--warm); }
footer { color: var(--muted); font-size: 0.8rem; }
footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오늘의 하늘</h1>
    <form id="search">
      <input id="q" type="search" placeholder="도시 이름 (예: 전주)" aria-label="도시 검색">
      <button type="submit">검색</button>
    </form>
  </header>

  <div class="chips" id="chips"></div>

  <section class="now" id="now" aria-live="polite">
    <span class="status">날씨를 불러오는 중…</span>
  </section>

  <section>
    <h2>시간별 (24시간)</h2>
    <div class="hourly" id="hourly"></div>
  </section>

  <section>
    <h2>7일 예보</h2>
    <ul class="days" id="days"></ul>
  </section>

  <footer>
    <span id="updated"></span> · 데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 30분마다 자동 새로고침
  </footer>
</div>

<script>
const PRESETS = [
  { name: "홍성", lat: 36.6009, lon: 126.665 },
  { name: "서울", lat: 37.5665, lon: 126.978 },
  { name: "부산", lat: 35.1796, lon: 129.0756 },
  { name: "인천", lat: 37.4563, lon: 126.7052 },
  { name: "대구", lat: 35.8714, lon: 128.6014 },
  { name: "대전", lat: 36.3504, lon: 127.3845 },
  { name: "광주", lat: 35.1595, lon: 126.8526 },
  { name: "제주", lat: 33.4996, lon: 126.5312 },
];

// WMO 날씨 코드 → [설명, 아이콘]
const WMO = {
  0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
  45: ["안개", "🌫️"], 48: ["짙은 안개", "🌫️"],
  51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌧️"],
  61: ["약한 비", "🌦️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
  66: ["어는 비", "🌧️"], 67: ["강한 어는 비", "🌧️"],
  71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["많은 눈", "❄️"], 77: ["싸락눈", "🌨️"],
  80: ["소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
  85: ["눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
  95: ["뇌우", "⛈️"], 96: ["우박 동반 뇌우", "⛈️"], 99: ["강한 우박 뇌우", "⛈️"],
};
const wmo = c => WMO[c] || ["알 수 없음", "❔"];
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const $ = id => document.getElementById(id);

function loadCity() {
  try { return JSON.parse(localStorage.getItem("city-v2")) || PRESETS[0]; } catch { return PRESETS[0]; }
}
function saveCity(c) { try { localStorage.setItem("city-v2", JSON.stringify(c)); } catch {} }

let city = loadCity();

function renderChips() {
  $("chips").innerHTML = "";
  for (const p of PRESETS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p.name;
    b.setAttribute("aria-pressed", p.name === city.name);
    b.onclick = () => setCity(p);
    $("chips").append(b);
  }
}

// 일교차와 기온, 강수로 옷차림 한 줄 추천
function clothingTip(min, max, rainPct) {
  const avg = (min + max) / 2;
  let tip;
  if (avg >= 27) tip = "반팔, 반바지 같은 가벼운 옷이 좋아요.";
  else if (avg >= 23) tip = "반팔이나 얇은 셔츠면 충분해요.";
  else if (avg >= 20) tip = "얇은 긴팔이나 가디건을 추천해요.";
  else if (avg >= 17) tip = "맨투맨이나 얇은 니트가 좋아요.";
  else if (avg >= 12) tip = "자켓이나 트렌치코트를 챙기세요.";
  else if (avg >= 9) tip = "코트와 니트가 필요해요.";
  else if (avg >= 5) tip = "두꺼운 코트를 입으세요.";
  else tip = "패딩과 목도리로 따뜻하게 입으세요.";
  if (max - min >= 10) tip += " 일교차가 크니 겉옷을 챙기세요.";
  if (rainPct >= 50) tip += " 비 올 확률이 높아요. 우산 ☂️ 챙기세요!";
  return tip;
}

async function load() {
  $("now").innerHTML = '<span class="status">날씨를 불러오는 중…</span>';
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m" +
    "&hourly=temperature_2m,weather_code,precipitation_probability" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=auto&forecast_days=7&wind_speed_unit=ms";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (e) {
    $("now").innerHTML = '<span class="status error">날씨를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.</span>';
  }
}

function render(d) {
  const c = d.current, dl = d.daily;
  const [desc, icon] = wmo(c.weather_code);
  const tip = clothingTip(dl.temperature_2m_min[0], dl.temperature_2m_max[0], dl.precipitation_probability_max[0] ?? 0);
  $("now").innerHTML = `
    <span class="icon">${icon}</span>
    <span class="temp">${Math.round(c.temperature_2m)}°</span>
    <span class="desc">${city.name} · ${desc} · 최고 ${Math.round(dl.temperature_2m_max[0])}° / 최저 ${Math.round(dl.temperature_2m_min[0])}°</span>
    <dl>
      <div><dt>체감</dt><dd>${Math.round(c.apparent_temperature)}°</dd></div>
      <div><dt>습도</dt><dd>${c.relative_humidity_2m}%</dd></div>
      <div><dt>바람</dt><dd>${c.wind_speed_10m.toFixed(1)} m/s</dd></div>
      <div><dt>강수확률</dt><dd>${dl.precipitation_probability_max[0] ?? 0}%</dd></div>
    </dl>
    <p class="tip">👕 ${tip}</p>`;

  // 시간별: 현재 시각부터 24시간
  const h = d.hourly;
  const start = Math.max(0, h.time.findIndex(t => t >= c.time.slice(0, 13)));
  $("hourly").innerHTML = h.time.slice(start, start + 24).map((t, i) => {
    const k = start + i, p = h.precipitation_probability[k];
    return `<div class="hour">
      <div class="t">${i === 0 ? "지금" : +t.slice(11, 13) + "시"}</div>
      <div>${wmo(h.weather_code[k])[1]}</div>
      <div>${Math.round(h.temperature_2m[k])}°</div>
      <div class="p">${p >= 20 ? p + "%" : ""}</div>
    </div>`;
  }).join("");

  // 7일: 주간 최저~최고 범위에 맞춘 막대
  const lo = Math.min(...dl.temperature_2m_min), hi = Math.max(...dl.temperature_2m_max), span = (hi - lo) || 1;
  $("days").innerHTML = dl.time.map((t, i) => {
    const date = new Date(t + "T00:00");
    const label = i === 0 ? "오늘" : `${DOW[date.getDay()]} ${date.getDate()}일`;
    const mn = dl.temperature_2m_min[i], mx = dl.temperature_2m_max[i], p = dl.precipitation_probability_max[i] ?? 0;
    return `<li class="day">
      <span>${label}</span>
      <span title="${wmo(dl.weather_code[i])[0]}">${wmo(dl.weather_code[i])[1]}</span>
      <span class="rain">${p >= 20 ? "💧" + p + "%" : ""}</span>
      <span class="range">
        <span class="lo">${Math.round(mn)}°</span>
        <span class="bar"><span style="left:${(mn - lo) / span * 100}%;right:${(hi - mx) / span * 100}%"></span></span>
        <span class="hi">${Math.round(mx)}°</span>
      </span>
    </li>`;
  }).join("");

  $("updated").textContent = "업데이트 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
}

function setCity(c) {
  city = c; saveCity(c); renderChips(); load();
}

$("search").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  try {
    const find = async name => {
      const res = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=10&language=ko&name=" + encodeURIComponent(name));
      return (await res.json()).results || [];
    };
    let results = await find(q);
    // 한글 도시명은 "전주"보다 "전주시"로 더 잘 찾아져서 한 번 더 시도
    if (!results.some(x => x.country_code === "KR") && /[가-힣]$/.test(q) && !q.endsWith("시")) {
      const more = await find(q + "시");
      if (more.length) results = more;
    }
    // 같은 이름이 여러 곳일 때 대한민국 도시를 우선
    const r = results.find(x => x.country_code === "KR") || results[0];
    if (!r) { $("now").innerHTML = `<span class="status error">"${q}"을(를) 찾지 못했어요. 다른 이름으로 검색해 보세요 (예: Jeonju).</span>`; return; }
    $("q").value = "";
    setCity({ name: r.name, lat: r.latitude, lon: r.longitude });
  } catch {
    $("now").innerHTML = '<span class="status error">검색에 실패했어요. 인터넷 연결을 확인해 주세요.</span>';
  }
});

renderChips();
load();
setInterval(load, 30 * 60 * 1000);
</script>
</body>
</html>
